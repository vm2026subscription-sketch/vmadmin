{% extends "layout.html" %}
{% block content %}
<h2>Edit Admin</h2>

<div class="card" style="max-width: 520px;">
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" value="{{ admin.username }}" required autocomplete="off" />
    </div>
    <div class="field">
      <label>New Password <span style="color: var(--muted); font-weight: 400; text-transform: none;">(leave blank to keep current)</span></label>
      <input type="password" name="password" placeholder="Enter new password" autocomplete="new-password" />
    </div>
    <div class="field">
      <label>Role</label>
      <select name="role">
        <option value="admin" {% if admin.role != 'super_admin' %}selected{% endif %}>Admin</option>
        <option value="super_admin" {% if admin.role == 'super_admin' %}selected{% endif %}>Super Admin</option>
      </select>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 8px;">
      <button type="submit" class="btn">Save Changes</button>
      <a href="{{ url_for('manage_admins') }}" class="btn" style="background: linear-gradient(135deg, #6b7a88, #4a5568); box-shadow: 0 4px 15px rgba(107,122,136,0.3);">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
