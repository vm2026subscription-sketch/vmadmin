<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or "VM Admin" }}</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --accent: #f58220;
        --text: #1f2a33;
        --muted: #6b7a88;
        --border: #e1e6ec;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f9fbff 0%, #f2f5f9 55%, #eef2f7 100%);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .brand {
        font-weight: 700;
        font-size: 20px;
      }

      .nav a {
        margin-left: 12px;
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }

      label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 600;
      }

      input, select, textarea {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
      }

      textarea { min-height: 90px; }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .flash {
        margin-bottom: 16px;
        background: #fff4e8;
        color: #a04900;
        border: 1px solid #ffd7b3;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }

      th {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .muted { color: var(--muted); }

      @media (max-width: 600px) {
        .header { flex-direction: column; align-items: flex-start; gap: 8px; }
        .nav a { margin-left: 0; margin-right: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">Vidyarthi Mitra Admin</div>
        <div class="nav">
          {% if session.admin_id %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('upload') }}">Upload</a>
            <a href="{{ url_for('logout') }}">Logout</a>
          {% endif %}
        </div>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
