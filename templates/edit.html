{% extends 'layout.html' %}
{% block content %}
  <div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2>Edit ePaper</h2>
    <form method="post">
      <div class="grid">
        <div class="field">
          <label>Date</label>
          <input type="date" name="date" value="{{ paper.date }}" />
        </div>
        <div class="field">
          <label>Language</label>
          <select name="language">
            <option value="English" {% if paper.language == 'English' %}selected{% endif %}>English</option>
            <option value="Marathi" {% if paper.language == 'Marathi' %}selected{% endif %}>Marathi</option>
          </select>
        </div>
        <div class="field">
          <label>Title (optional)</label>
          <input type="text" name="title" value="{{ paper.title }}" />
        </div>
        <div class="field">
          <label>PDF URL</label>
          <input type="url" name="url" value="{{ paper.link }}" placeholder="https://example.com/paper.pdf" required />
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn" type="submit">Update Paper</button>
        <a href="{{ url_for('dashboard') }}" style="display: inline-flex; align-items: center; padding: 12px 24px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; text-decoration: none; transition: all 0.3s ease;">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
